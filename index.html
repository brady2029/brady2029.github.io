<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000" />
<title>Brady Williams</title>
<meta name="description" content="Brady Williams — Finance + MIS @ University of Georgia. Projects, research and experience." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23E60012'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Karla:wght@400;500;700&family=Nanum+Gothic:wght@400;700&family=Open+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
/* ============ tokens (from Figma "Designing" page) ============ */
#stage{
  --bg:#e9e9e9; --ink:#000; --text:#2b2b2b; --muted:#8a8a8a; --soft:#555;
  --menu:#f1f1f1; --menu-solid:#f1f1f1; --mi:#f1f1f1; --mi-gray:#929292;
  --sel:#215fe5; --blue:#4499ff; --red:#e60012; --green:#14cb0c;
  --card:#efefef; --card-sel:#f6f6f6; --line:#d6d6d6; --vdiv:#cfcfcf;
  --chip:#f6f6f6; --shot:#c8c8c8; --thumb:#d6d6d6;
  --ph-bg:#f6f6f6; --ph-bd:6px solid #fff; --tile-bd:6px solid #fff;
  --off:rgba(0,0,0,.2); --btn2:#f6f6f6; --play:#1a9e4a;
  --t:385px; --tg:20px;
}
#stage.dark{
  --bg:#343434; --ink:#fff; --text:#f3f3f3; --muted:#a8a8a8; --soft:#d4d4d4;
  --menu:transparent; --menu-solid:#343434; --mi:#4d4d4d; --mi-gray:#e6e6e6;
  --sel:#4499ff; --card:#3c3c3c; --card-sel:#454545; --line:#4d4d4d; --vdiv:#5a5a5a;
  --chip:#4a4a4a; --shot:#444; --thumb:#4a4a4a;
  --ph-bg:transparent; --ph-bd:4px solid #4d4d4d; --tile-bd:1px solid #000;
  --off:rgba(255,255,255,.2); --btn2:#4a4a4a; --play:#3dce6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e9;font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body.dark{background:#343434}
body.asleep,body.asleep.dark{background:#000}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;transition:background .35s}
.screen{position:absolute;inset:0;visibility:hidden;opacity:0;pointer-events:none}
.screen.on{visibility:visible;opacity:1;pointer-events:auto}
#home{background:#e9e9e9}
#stage.dark #home{background:#343434}
#home.under{pointer-events:none}
#experience,#research{background:var(--bg)}
#projects{background:#e8e8e8}
#stage.dark #projects{background:#343434}
#gallery{background:#ececec}
#stage.dark.albumpage #gallery{background:#343434}
.screen.applet-in{z-index:4;animation:screenFade .18s ease both}
.screen.applet-out{z-index:6;pointer-events:none;animation:screenFade .16s ease reverse both}
@keyframes screenFade{from{opacity:0}to{opacity:1}}
.box{position:absolute;width:1920px;height:1080px;left:calc(50% - 960px);top:calc(50% - 540px)}

/* ============ sleep: home is already on, dimmed ============ */
@keyframes pulse{50%{opacity:.55}}
@keyframes ledBreathe{0%,100%{opacity:.3}50%{opacity:1}}
#stage.asleep #chrome{z-index:60}
#stage.asleep #chrome,
#stage.asleep #chrome *{pointer-events:none!important}
#stage.asleep #profile,
#stage.asleep .wifi,
#stage.asleep .batt,
#stage.asleep .hints,
#stage.asleep .hdiv,
#stage.asleep .ctrl svg,
#stage.asleep .ctrl .pl i:not(:first-child){opacity:0}
#stage.asleep .time{color:#fff}
#stage.asleep .ctrl .pl i:first-child{animation:ledBreathe 2.8s ease-in-out infinite;box-shadow:0 0 10px 1px rgba(20,203,12,.9)}
.wifi,.batt,.hints,.hdiv,.ctrl svg,.ctrl .pl i{transition:opacity .55s ease}
.time{transition:color .7s ease}

/* ============ chrome (shared top/bottom bars) ============ */
#chrome{position:absolute;inset:0;z-index:10;pointer-events:none;transition:opacity .35s}
#chrome>*{pointer-events:auto}
#profile{position:absolute;left:80px;top:80px;width:128px;height:128px;border-radius:50%;border:3px solid #fff;background:#afd6f9;overflow:hidden;transition:transform .15s,opacity .55s ease,border-color .35s}
#stage.dark #profile{border-color:#9a9a9a}
#profile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
#profile.sel{box-shadow:0 0 0 5px var(--menu-solid),0 0 0 11px var(--blue)}
.data{position:absolute;right:80px;top:107px;display:flex;align-items:center;gap:32px;color:var(--ink)}
.time{display:flex;align-items:baseline;gap:6px;height:32px;font-family:Karla,sans-serif;line-height:1;margin-top:-6px}
.time b{font-weight:500;font-size:48px;letter-spacing:2.88px}
.time span{font-weight:700;font-size:28px}
.wifi{width:44px;height:32px;display:block}
.batt{position:relative;width:54px;height:32px}
.batt i{position:absolute;background:var(--ink);border-radius:2px}
.batt i:nth-child(1){left:0;top:0;width:48px;height:32px;background:none;border:4px solid var(--ink);border-radius:5px}
.batt i:nth-child(2){left:8px;top:8px;width:32px;height:16px}
.batt i:nth-child(3){left:48px;top:10px;width:6px;height:12px;border-radius:0 2px 2px 0}
.ctrl{position:absolute;left:79px;bottom:30px;display:flex;align-items:center;gap:10px}
.ctrl .pl{display:flex;flex-direction:column;gap:4px}
.ctrl .pl i{width:12px;height:12px;border-radius:2px;background:var(--off)}
.ctrl .pl i:first-child{background:var(--green)}
.ctrl.pad .pl i:first-child{animation:pulse 1s 3}
.ctrl svg{display:block;width:62px;height:68px}
.hints{position:absolute;right:80px;bottom:40px;display:flex;gap:24px;align-items:center}
.hint{display:flex;align-items:center;gap:8px;font-size:30px;letter-spacing:-.3px;color:var(--ink)}
.hint svg{width:48px;height:48px;display:block;transition:transform .1s}
.hint:active svg{transform:scale(.88)}
.hint[hidden]{display:none}
.hdiv{position:absolute;left:80px;right:80px;bottom:120px;height:2px;background:#5a5a5a;display:none}
#stage.dark .hdiv{display:block}

/* ============ home ============ */
#home .row{position:absolute;left:160px;top:calc(50% - 241px);display:flex;gap:var(--tg);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.tile{position:relative;flex:none;width:var(--t);height:var(--t);border-radius:20px;filter:drop-shadow(0 0 16px rgba(0,0,0,.02))}
.tile .img{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--shot)}
.tile .img img{position:absolute;max-width:none;pointer-events:none}
.tile .img img.fill{inset:0;width:100%;height:100%;object-fit:cover}
.tile.sel .img{border:var(--tile-bd)}
.tile.ph .img{background:var(--ph-bg);border:var(--ph-bd)}
.tile .glow{position:absolute;left:-6.5px;top:-6.5px;width:calc(var(--t) + 13px);height:calc(var(--t) + 13px);border-radius:26px;overflow:hidden;background:#f1f1f1;opacity:0;transform:scale(1.05);pointer-events:none}
#stage.dark .tile .glow{background:var(--blue)}
.tile.sel .glow{opacity:1;transform:none;transition:opacity .16s,transform .22s cubic-bezier(.3,1.6,.5,1)}
.spin{position:absolute;inset:-50%;animation:spin 7s linear infinite}
#stage.dark .spin{display:none}
.spin i{position:absolute;width:50%;height:50%;border-radius:50%;filter:blur(60px)}
.spin i:nth-child(1){left:50%;top:0;background:#ff66b8}
.spin i:nth-child(2){left:50%;top:50%;background:#6b66ff}
.spin i:nth-child(3){left:0;top:50%;background:#66f2ff}
.spin i:nth-child(4){left:0;top:0;background:#9966ff}
@keyframes spin{to{transform:rotate(360deg)}}
#stage.dark .tile.sel .glow{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(1.25)}}
.tile .ttl{position:absolute;left:50%;top:-66px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;color:var(--sel);font-size:36px;letter-spacing:-1.44px;white-space:nowrap;opacity:0;pointer-events:none}
.tile.sel .ttl{opacity:1;transition:opacity .15s}
.ttl svg{width:29px;height:36px;display:block}
.tile.press{animation:press .2s ease}
@keyframes press{40%{transform:scale(.95)}}
.menu{position:absolute;left:50%;top:calc(50% + 224px);transform:translateX(-50%);display:flex;gap:40px;padding:20px;border-radius:70px;background:var(--menu);transition:background .35s}
.menu .grp{display:flex;gap:27px;align-items:center}
.mi{position:relative;width:100px;height:100px;flex:none;border-radius:50px}
.mi .face{position:absolute;inset:0;border-radius:50%;background:var(--mi);display:grid;place-items:center;transition:background .35s}
.mi.nso .face{background:var(--red)}
.mi svg{display:block;width:80px;height:80px}
.mi.nso svg{width:100px;height:100px}
.mi .ring{position:absolute;inset:-11px;border-radius:50%;overflow:hidden;opacity:0;transform:scale(1.08);pointer-events:none}
.mi .ring{background:#f1f1f1}.mi .ring .spin{inset:-30%}
.mi .ring .spin i{filter:blur(18px)}
#stage.dark .mi .ring{background:var(--blue)}
.mi .face{box-shadow:0 0 0 0 var(--menu-solid)}
.mi.sel .face{box-shadow:0 0 0 5px var(--menu-solid)}
.mi.sel .ring{opacity:1;transform:none;transition:opacity .15s,transform .22s cubic-bezier(.3,1.6,.5,1)}
.mi .lbl{position:absolute;left:50%;bottom:calc(100% + 34px);transform:translateX(-50%);font-size:28px;letter-spacing:-.8px;color:var(--sel);white-space:nowrap;opacity:0;pointer-events:none}
.mi.sel .lbl{opacity:1;transition:opacity .15s}
.mi.press .face{animation:press .2s ease}
.g{stroke:var(--mi-gray)} .gf{fill:var(--mi-gray)}
/* boot-in */
#home.boot .tile,#home.boot .menu,#home.boot ~ x{animation:none}
#home.boot .tile{animation:tileIn .42s cubic-bezier(.2,.8,.2,1) both}
#home.boot .tile:nth-child(2){animation-delay:.04s}#home.boot .tile:nth-child(3){animation-delay:.08s}#home.boot .tile:nth-child(4){animation-delay:.12s}#home.boot .tile:nth-child(5){animation-delay:.16s}#home.boot .tile:nth-child(6){animation-delay:.2s}
#home.boot .menu{animation:menuIn .42s .08s cubic-bezier(.2,.8,.2,1) both}
@keyframes tileIn{from{opacity:0;transform:translateX(28px)}}
@keyframes menuIn{from{opacity:0;transform:translate(-50%,16px)}}
.chrome-in{animation:fadeIn .5s both}
@keyframes fadeIn{from{opacity:0}}

/* ============ detail screens (shared) ============ */
.scroll{position:absolute;inset:0}
.kick{font-size:20px;font-weight:600;color:var(--muted);white-space:pre;letter-spacing:.2px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{height:48px;border-radius:24px;background:var(--chip);color:var(--soft);font-size:22px;padding:0 22px;display:flex;align-items:center;white-space:nowrap}
.pill{height:80px;border-radius:40px;padding:0 54px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:30px;font-weight:600;white-space:nowrap;transition:transform .12s,filter .12s}
.pill.red{background:var(--red);color:#fff}
.pill.alt{background:var(--btn2);color:var(--text)}
.pill:hover{filter:brightness(1.06)}
.pill:active{transform:scale(.95)}
.fadeSwap{animation:swap .22s ease both}
@keyframes swap{from{opacity:0;transform:translateX(14px)}}

/* ---------- Switch selection (pulsing cyan/blue frame) ---------- */
@keyframes selpulse{0%,100%{border-color:#36c6ff;box-shadow:0 0 0 1px rgba(54,198,255,.25)}50%{border-color:#2f6dff;box-shadow:0 0 0 1px rgba(47,109,255,.25)}}

/* feed (Research) — System Settings style list */
.feed .list{position:absolute;left:120px;top:190px;width:620px;height:750px;overflow:hidden;padding:4px}
.feed .list-in{display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.card{position:relative;flex:none;width:100%;min-height:108px;border-radius:14px;background:none;border:4px solid transparent;text-align:left;padding:18px 24px;display:flex;flex-direction:column;justify-content:center;transition:background .15s}
.card+.card::before{content:"";position:absolute;left:24px;right:24px;top:-3px;height:2px;background:var(--line)}
.card.sel::before,.card.sel+.card::before{display:none}
.card.sel{background:#fff;border-color:#5ad4e4;animation:none}
#stage.dark .card.sel{background:#3c3c3c;border-color:#3ec8dc}
.card:hover:not(.sel){background:rgba(127,127,127,.06)}
.card .ct{font-size:26px;font-weight:600;line-height:34px;color:var(--text)}
.card.sel .ct{color:var(--sel)}
.feed .vdiv{position:absolute;left:780px;top:190px;width:2px;height:750px;background:var(--vdiv)}
.feed .detail{position:absolute;left:830px;top:190px;width:1010px;height:750px;display:flex;flex-direction:column;align-items:flex-start}
.detail h2{margin:0;max-width:100%;min-width:0;font-size:48px;line-height:1.15;font-weight:600;color:var(--text);letter-spacing:-.4px;white-space:nowrap}
.detail h2 .mark{height:1em;width:auto;margin-left:.22em;vertical-align:-.12em;display:inline-block}
.detail .role{margin-top:12px;font-size:24px;line-height:1.35;color:var(--blue)}
.detail .prof{margin-top:4px;font-size:20px;line-height:1.35;color:var(--muted)}
.detail .lead{margin:28px 0 0;max-width:940px;font-size:26px;line-height:40px;color:var(--soft)}
.with{margin-top:32px}
.with-l{font-size:17px;font-weight:600;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.whos{display:flex;flex-direction:column;align-items:flex-start;flex-wrap:nowrap;gap:2px;margin-top:0}
.who{height:auto;padding:6px 0;border-radius:0;background:none;color:var(--text);display:flex;align-items:center;gap:14px;text-decoration:none;transition:none}
.who .av{width:44px;height:44px;border-radius:50%;background:#0a66c2;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;letter-spacing:-.2px;flex:none;overflow:hidden}
.who .av img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.who .nm{font-size:22px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
a.who:hover .nm{text-decoration:underline;text-underline-offset:4px}
.detail .foot{position:static;width:100%;height:auto;margin-top:auto;display:flex;align-items:center;justify-content:flex-end;gap:24px}

/* experience — resume list on the theme field */
.lr{display:inline-grid;place-items:center;min-width:52px;height:34px;padding:0 10px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:20px;font-weight:700;letter-spacing:.5px}
.hint .lr{min-width:40px;height:30px;font-size:18px;margin-right:-2px}
.badge{flex:none;display:inline-grid;place-items:center;line-height:1;text-align:center;border-radius:22%;font-weight:700;color:#fff;letter-spacing:-.5px}
.resume{position:absolute;left:50%;width:1168px;margin-left:-584px;top:160px;bottom:136px;overflow-y:auto;scrollbar-width:none;color:var(--text);padding:16px 24px 40px}
.resume::-webkit-scrollbar{display:none}
.resume.more{-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
.scroll-hint{position:absolute;left:50%;bottom:112px;z-index:6;width:36px;height:28px;margin-left:-18px;color:var(--text);opacity:0;pointer-events:none;display:grid;place-items:center}
.scroll-hint.on{opacity:1;pointer-events:auto}
.scroll-hint svg{width:22px;height:22px;display:block}
.scroll-hint.on svg{animation:hintFlash 1.15s ease-in-out infinite}
@keyframes hintFlash{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.scroll-hint.on svg{animation:none;opacity:.85}}
.resume-h{display:flex;align-items:center;height:auto;margin:0 0 40px;padding:0;font-size:28px;font-weight:500;letter-spacing:-.3px;color:var(--text)}
.resume-more{margin-top:72px}
.resume-row{display:grid;grid-template-columns:320px minmax(0,1fr);column-gap:48px;align-items:start;width:100%;margin:0 0 52px;padding:0;border:0;border-radius:0;box-shadow:none;text-align:left;color:var(--text);background:transparent;outline:none;text-decoration:none;cursor:default}
.resume-row:hover,.resume-row:focus,.resume-row:focus-visible,.resume-row:active{background:transparent;outline:none;box-shadow:none;border:0}
a.resume-row[href]{cursor:pointer}
.resume-row{position:relative}
.resume-when,.resume-tx{position:relative;z-index:2}
.rglow{position:absolute;inset:-14px -22px;border-radius:20px;overflow:hidden;background:#f1f1f1;opacity:0;transform:scale(1.03);pointer-events:none;z-index:0}
.rfill{position:absolute;inset:-10px -18px;border-radius:16px;background:var(--bg);opacity:0;pointer-events:none;z-index:1}
a.resume-row:hover .rglow{opacity:1;transform:none;transition:opacity .16s,transform .22s cubic-bezier(.3,1.6,.5,1)}
a.resume-row:hover .rfill{opacity:1}
#stage.dark .rglow{background:var(--blue)}
#stage.dark a.resume-row:hover .rglow{animation:breathe 1.6s ease-in-out infinite}
.resume-tx b .badge.in{display:inline-grid;width:28px;height:28px;font-size:11px;margin:0 2px 0 12px;vertical-align:-6px;border-radius:7px;color:#fff;letter-spacing:-.3px}
.rglow .spin{inset:auto;left:50%;top:50%;width:1300px;height:1300px;margin:-650px 0 0 -650px}
.rglow .spin i{filter:blur(40px)}
.rglow,.rfill{display:none!important}
.resume-tx b .ps-logo{height:1em;max-width:2.4em;margin:0;flex:none}
.resume-row.hov:hover .rglow{opacity:1;transform:none;transition:opacity .16s,transform .22s cubic-bezier(.3,1.6,.5,1)}
.resume-row.hov:hover .rfill{opacity:1}
#stage.dark .resume-row.hov:hover .rglow{animation:breathe 1.6s ease-in-out infinite}
.resume-body{grid-column:2;min-width:0;position:relative;z-index:2}
.resume-body p{margin:14px 0 0;font-size:22px;line-height:34px;color:var(--soft)}
.resume-body .with{margin-top:20px}
.resume-body .foot{margin-top:20px;display:flex;justify-content:flex-start}
.resume-body .pill{height:56px;padding:0 32px;font-size:22px}
.plink{background:none;border:0;padding:0;margin:0;font:inherit;line-height:inherit;color:inherit;text-align:inherit;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:pointer;outline:none}
.plink:hover{color:var(--text)}
.with-sum{display:inline-flex;align-items:center;gap:16px;margin:0;padding:4px 18px 4px 0;background:none;border:0;border-radius:32px;font:inherit;color:var(--text);cursor:pointer;outline:none}
.stack{display:inline-flex;flex:none}
.stack .av{width:52px;height:52px;margin-left:-16px;border-radius:50%;border:3px solid var(--bg);background:#0a66c2;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;overflow:hidden;box-sizing:border-box}
.stack .av:first-child{margin-left:0}
.stack .av img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.with-t{font-size:22px;font-weight:500;letter-spacing:-.2px;white-space:nowrap}
.with-sum .chev{width:20px;height:20px;color:var(--muted);transition:transform .25s ease}
.with.open .chev{transform:rotate(180deg)}
.with-sum:hover .with-t{text-decoration:underline;text-underline-offset:4px}
.whos-wrap{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .28s ease,visibility 0s .28s}
.with.open .whos-wrap{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .28s ease,visibility 0s}
.whos-wrap .whos{overflow:hidden;min-height:0;margin-top:0;padding-top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.with .whos-wrap .who{display:flex;align-items:center;gap:14px;height:auto;padding:6px 0;border-radius:0;background:none;box-shadow:none;text-decoration:none;color:var(--text)}
.with .whos-wrap .who .av{width:44px;height:44px;margin:0;flex:none}
.with .whos-wrap .who:hover .nm{text-decoration:underline;text-underline-offset:4px}
a.with-sum{text-decoration:none}
.resume-lead .resume-row:last-child,.resume-more .resume-row:last-child{margin-bottom:0}
.resume-when{padding-top:3px;font-size:22px;font-weight:400;color:var(--muted);white-space:nowrap}
.resume-tx{min-width:0}
.resume-tx b{display:flex;align-items:center;column-gap:.45em;font-size:26px;font-weight:500;letter-spacing:-.2px;line-height:1.3;color:var(--text)}
.resume-tx span{display:block;margin-top:8px;font-size:22px;font-weight:400;color:var(--muted)}
.resume-tx span a{color:inherit;cursor:pointer}
.resume-tx span a:hover{text-decoration:underline;text-underline-offset:3px}
.resume-tx .ext{display:inline-block;width:16px;height:16px;margin-left:8px;vertical-align:-2px;color:var(--text);opacity:.72}

#stage.portrait .plays{position:relative;inset:auto;display:flex;flex-direction:column;overflow:visible}
#stage.portrait .play::before{display:none}
#stage.portrait .pv-play-h{position:relative;height:72px;display:flex;align-items:center}
#stage.portrait .pv-play-h .bar{position:relative;left:auto;top:auto;height:28px;margin:0 14px 0 4px}
#stage.portrait .pv-play-h .label{position:static;font-size:42px;line-height:1}
#stage.portrait .ps-q{position:relative;left:auto;top:auto;margin-left:auto;width:40px;height:40px;font-size:26px}
#stage.portrait .ps-q svg{width:40px;height:40px}
#stage.portrait .play{position:relative;left:auto;top:auto;width:100%;height:auto;min-height:148px;display:flex;align-items:center;gap:20px;padding:16px 8px;border-bottom:1px solid #d2d2d2}
#stage.portrait .play.sel{box-shadow:inset 0 0 0 3px #00DBE9}
#stage.portrait .play-ico{position:relative;left:auto;top:auto;width:104px;height:104px;margin-top:0;filter:none;object-fit:contain;flex:none}
#stage.portrait .play .tx{min-width:0}
#stage.portrait .play .tx b,#stage.portrait .play .tx span{position:static;left:auto;top:auto;margin-top:0;white-space:normal}
#stage.portrait .play .tx b{display:block;font-size:42px;line-height:1.25;overflow-wrap:break-word}
#stage.portrait .play .tx span{display:block;margin-top:6px;font-size:34px;line-height:1.3}
#stage.portrait .ps-ava{position:relative;left:auto;top:auto;width:320px;height:320px}
#stage.portrait .ps-name-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px}
#stage.portrait .ps-name{position:static;font-size:64px;line-height:1.1;min-width:0}
#stage.portrait .ps-pencil{position:static;width:36px;height:36px}
#stage.portrait .ps-now{display:grid;grid-template-columns:110px 1fr;column-gap:18px;row-gap:6px;align-items:center;margin-top:20px}
#stage.portrait .ps-game{position:relative;left:auto;top:auto;width:110px;height:110px;grid-row:1 / span 3}
#stage.portrait .ps-game.app{width:110px;height:110px;filter:none}
#stage.portrait .ps-sub{position:static;font-size:34px;line-height:1.3;max-width:none;min-width:0;white-space:normal}
#stage.portrait .ps-online{position:static;font-size:36px}
#stage.portrait .ps-game-name{position:static;font-size:44px;line-height:1.25;white-space:normal;max-width:none;overflow-wrap:break-word}
#stage.portrait .ps-social{position:relative;left:auto;top:auto;margin-top:16px;gap:22px}
#stage.portrait .ps-social a{height:64px}
#stage.portrait .ps-social img{height:64px}
#stage.portrait .ps-bio{position:relative;left:auto;top:auto;width:auto;height:auto;margin-top:28px;padding:0;background:transparent;font-size:46px;line-height:68px}
#stage.portrait .album{left:36px;right:36px;top:calc(40px + var(--safe-t));bottom:calc(150px + var(--safe-b))}
#stage.portrait .album-head{height:auto;min-height:88px}
#stage.portrait .album-title{font-size:56px;gap:16px}
#stage.portrait .album-title svg{width:56px;height:56px}
#stage.portrait .album-count{font-size:40px}
#stage.portrait .album-grid{grid-template-columns:repeat(2,1fr);gap:18px}
#stage.portrait .viewer-x{top:calc(28px + var(--safe-t));right:calc(28px + var(--safe-r));width:120px;height:120px}
#stage.portrait .viewer-x svg{width:46px;height:46px}
#stage.portrait .viewer-cap{font-size:38px}


#stage.portrait .thumb .cover .cn{font-size:24px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

const SFX = {
  ctx:null, out:null, muted:false,
  init(){
    if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); this.out=this.ctx.createGain(); this.out.gain.value=.55; this.out.connect(this.ctx.destination);}catch(e){} }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
  },
  tone(f, f2, dur, type='sine', vol=.15, delay=0){
    const c=this.ctx; if(!c||this.muted) return;
    const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t+dur+.03);
  },
  noise(dur, freq, vol=.2, delay=0){
    const c=this.ctx; if(!c||this.muted) return;
    const t=c.currentTime+delay, n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    s.buffer=b; f.type='bandpass'; f.frequency.value=freq; f.Q.value=1.2; g.gain.value=vol;
    s.connect(f).connect(g).connect(this.out); s.start(t);
  },
  move(){ this.noise(.018,3200,.35); this.tone(1750,1300,.03,'triangle',.05); },
  ok(){ this.noise(.02,2400,.3); this.tone(880,880,.05,'sine',.12); this.tone(1320,1320,.08,'sine',.1,.045); },
  back(){ this.noise(.02,2000,.25); this.tone(990,990,.05,'sine',.1); this.tone(660,660,.08,'sine',.09,.045); },
  open(){ this.noise(.03,1800,.3); [523,659,784,1047].forEach((f,i)=>this.tone(f,0,.18,'sine',.08,i*.045)); },
  lock(){ this.noise(.025,2600,.35); this.tone(1200,900,.05,'triangle',.08); },
  unlock(){ [392,523,659,784].forEach((f,i)=>this.tone(f,0,.25,'sine',.09,i*.06)); },
  boot(){ this.tone(523,0,.35,'sine',.08); this.tone(784,0,.45,'sine',.07,.08); this.tone(1047,0,.6,'sine',.06,.16); },
  bonk(){ this.tone(180,140,.09,'square',.04); },
  snap(){ this.noise(.03,4000,.35); this.tone(600,1200,.07,'sine',.08); },
  sleep(){ [784,523,392].forEach((f,i)=>this.tone(f,0,.22,'sine',.08,i*.08)); }
};

/* ---------- stage fit (16:9 landscape, 9:x portrait) ---------- */
let W=1920, H=1080, PORTRAIT=false;
function viewportBox(){
  const vv=window.visualViewport;
  return vv ? {w:vv.width, h:vv.height, x:vv.offsetLeft, y:vv.offsetTop} : {w:window.innerWidth, h:window.innerHeight, x:0, y:0};
}
function safeStage(scale){
  let el=$('#safeProbe');
  if(!el){ el=document.createElement('div'); el.id='safeProbe'; el.setAttribute('aria-hidden','true'); document.body.appendChild(el); }
  const c=getComputedStyle(el), px=v=>parseFloat(v)||0, s=scale||1;
  return {t:px(c.paddingTop)/s, r:px(c.paddingRight)/s, b:px(c.paddingBottom)/s, l:px(c.paddingLeft)/s};
}
function layoutPortraitHome(safe){
  if(!PORTRAIT){ stage.style.removeProperty('--row-top'); stage.style.removeProperty('--menu-top'); stage.style.removeProperty('--t'); return; }
  const topChrome=(safe.t||0)+280, botChrome=(safe.b||0)+220, menuBlock=400, gap=96;
  const avail=H-topChrome-botChrome-menuBlock-gap;
  const t=Math.max(420, Math.min(600, Math.round(avail)));
  const block=t+gap+menuBlock;
  const free=H-topChrome-botChrome-block;
  const rowTop=Math.round(topChrome+Math.max(12, free/2));
  let menuTop=rowTop+t+gap;
  const limit=H-botChrome-12;
  if(menuTop+menuBlock>limit) menuTop=Math.max(rowTop+t+36, limit-menuBlock);
  stage.style.setProperty('--t', t+'px');
  stage.style.setProperty('--row-top', rowTop+'px');
  stage.style.setProperty('--menu-top', menuTop+'px');
}
function fit(){
  const vp=viewportBox(), vw=vp.w, vh=vp.h, ar=vw/Math.max(1,vh);
  PORTRAIT = ar < .9;
  if(PORTRAIT){ W=1080; H=Math.max(1400, Math.round(1080/ar)); }
  else if(ar >= 16/9){ H=1080; W=Math.round(1080*ar); }
  else { W=1920; H=Math.round(1920/ar); }
  const s = vw/W;
  stage.style.width=W+'px'; stage.style.height=H+'px';
  stage.style.transform=`scale(${s})`;
  stage.style.left=vp.x+'px'; stage.style.top=vp.y+'px';
  stage.classList.toggle('portrait', PORTRAIT);
  const safe=safeStage(s);
  stage.style.setProperty('--safe-t', safe.t+'px');
  stage.style.setProperty('--safe-r', safe.r+'px');
  stage.style.setProperty('--safe-b', safe.b+'px');
  stage.style.setProperty('--safe-l', safe.l+'px');
  layoutPortraitHome(safe);
  updateRow(false); fitProfile(); fitResearchTitle();
  if(S.screen==='about') renderAbout();
  if(S.screen==='projects') renderProjects();
  if(S.screen==='gallery') renderGallery(false);
  if($('#viewer').classList.contains('on') && !$('#viewer').classList.contains('closing')) refitViewer();
}
window.addEventListener('resize', fit);
if(window.visualViewport){
  visualViewport.addEventListener('resize', fit);
  visualViewport.addEventListener('scroll', fit);
}

function openScreen(id){
  if(!$('#'+id) || S.screen===id) return;
  navGen++;
  S.screen=id; setRed(false); stage.classList.toggle('userpage', id==='about'); stage.classList.remove('newspage'); stage.classList.toggle('albumpage', id==='gallery'); $('#hintLR').hidden = true;
  setBackHint(false, id==='about' ? 'Back' : 'Return Back');
  const okLbl=$('#hintOk').lastChild; if(okLbl) okLbl.textContent = 'OK';
  document.querySelector('meta[name=theme-color]').content = id==='gallery' ? (stage.classList.contains('dark')?'#343434':'#ececec') : (stage.classList.contains('dark')?'#343434':'#e9e9e9');
  $$('.screen').forEach(s=>{ if(s.id!=='home'){ s.classList.remove('on','enter','applet-in','applet-out'); s.style.zIndex=''; } });
  $$('video', $('#'+id)).forEach(v=>v.play().catch(()=>{}));
  const home=$('#home'); home.classList.add('on','under'); home.inert=true;
  const scr=$('#'+id);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  scr.classList.remove('applet-out');
  scr.classList.add('on');
  if(!reduce){
    scr.classList.add('applet-in');
    scr.addEventListener('animationend', e=>{ if(e.target===scr) scr.classList.remove('applet-in'); }, {once:true});
  }
  const sc=$('.scroll',scr); if(sc) sc.scrollTop=0;
  if(id==='experience') renderExp(false);
  if(id==='research') renderResearch(false);
  if(id==='projects') renderProjects();
  if(id==='about'){ S.idx.about=-1; fitProfile(); renderAbout(); }
  if(id==='gallery') renderGallery(false);
  renderSel();
}
function back(){
  if($('#viewer').classList.contains('on')){ closeViewer(); return; }
  if(S.screen==='home'||S.screen==='sleep'){ SFX.bonk(); return; }
  const cur=$('#'+S.screen);
  if(!cur || cur.classList.contains('applet-out')) return;
  SFX.back(); buzz(6);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ showHome(false); return; }
  const gen=++navGen;
  cur.classList.remove('applet-in');
  cur.classList.add('applet-out');
  const home=$('#home'); home.classList.add('on','under'); home.inert=true;
  const finish=()=>{ if(gen!==navGen) return; navGen++; showHome(false); };
  cur.addEventListener('animationend', e=>{ if(e.target===cur) finish(); });
  setTimeout(finish, 260);
}
function tabStep(dir){
  if(S.screen!=='projects') return false;
  pageScroll('#projects', dir||0);
  return true;
}
function detailMove(dx,dy){
  const id=S.screen;
  if(id==='experience'){ pageScroll('#experience', dy||dx); return; }
  if(id==='research'){ pageScroll('#research', dy||dx); return; }
  if($('#viewer').classList.contains('on') && shotSet){
    const dir=dx||dy;
    if(!dir){ SFX.bonk(); return; }
    const n=shotAt+dir;
    if(n<0||n>=shotSet.length){ SFX.bonk(); return; }
    shotAt=n; SFX.move();
    openViewer(shotSet[n], null, {swap:true, shots:true});
    return;
  }
  if(id==='projects'){ pageScroll('#projects', dy||dx); return; }
  if(id==='about'){

/* viewer — shared-element expand, sized to the stage */
let viewToken=0, viewerFrom=null, viewerPos='center';
const VIEW_EASE='cubic-bezier(.16, 1, .22, 1)';
function stageBox(el){
  const sr=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
  const sx=sr.width/stage.offsetWidth||1, sy=sr.height/stage.offsetHeight||1;
  return { x:(r.left-sr.left)/sx, y:(r.top-sr.top)/sy, w:r.width/sx, h:r.height/sy };
}
function photoBox(nw, nh){
  const ar=(nw||16)/(nh||9);
  const mx=Math.max(28, Math.round(W*0.025));
  const my=Math.max(28, Math.round(H*0.028));
  const cap=0;
  const maxW=W-mx*2, maxH=H-my*2-cap;
  let w=maxW, h=w/ar;
  if(h>maxH){ h=maxH; w=h*ar; }
  return { x:(W-w)/2, y:my+Math.max(0,(maxH-h)/2), w, h, cap };
}
function setBox(el, b){
  el.style.left=b.x+'px'; el.style.top=b.y+'px'; el.style.width=b.w+'px'; el.style.height=b.h+'px';
}
function placeCaption(b){
  const cap=$('#viewer .viewer-cap');
  cap.style.left=b.x+'px'; cap.style.width=b.w+'px';
  cap.style.top=(b.y+b.h+Math.round(Math.min(20, Math.max(12, H*0.014))))+'px';
}
function markSource(el){
  $$('.is-source').forEach(n=>n.classList.remove('is-source'));
  if(!el){ viewerFrom=null; return; }
  el.classList.add('is-source');
  viewerFrom=el;
  const mi=$('img', el); viewerPos=(mi&&mi.style.objectPosition)||'center';
}
function morphCard(from, to, opt){
  const card=$('#viewer .viewer-card'), img=$('img', card);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  card.getAnimations().forEach(a=>a.cancel());
  img.getAnimations().forEach(a=>a.cancel());
  setBox(card, to);
  card.style.borderRadius=opt.radiusTo;
  img.style.objectPosition=opt.posTo;
  if(opt.caption!==false) placeCaption(to);
  if(reduce) return Promise.resolve(true);
  const anim=card.animate([
    { left:from.x+'px', top:from.y+'px', width:from.w+'px', height:from.h+'px', borderRadius:opt.radiusFrom },
    { left:to.x+'px', top:to.y+'px', width:to.w+'px', height:to.h+'px', borderRadius:opt.radiusTo }
  ], { duration:opt.ms, easing:opt.ease||VIEW_EASE, fill:'both' });
  const pan=img.animate([
    { objectPosition:opt.posFrom },
    { objectPosition:opt.posTo }
  ], { duration:opt.ms, easing:opt.ease||VIEW_EASE, fill:'both' });
  return anim.finished.then(()=>{ anim.cancel(); pan.cancel(); return true; }).catch(()=>false);
}
function refitViewer(){

  const to=photoBox(img.naturalWidth, img.naturalHeight);

function openVideoViewer(src, fromEl, opt){
  const v=$('#viewer');

  v.classList.remove('closing');
  const start=()=>{
    if(token!==viewToken) return;
    const to=photoBox(vid.videoWidth||16, vid.videoHeight||9);
    const from=fromEl?stageBox(fromEl):{x:to.x+to.w*.04, y:to.y+to.h*.04+14, w:to.w*.92, h:to.h*.92};
    placeCaption(to);
    v.classList.add('on');
    v.classList.remove('settled');

      {left:from.x+'px',top:from.y+'px',width:from.w+'px',height:from.h+'px',borderRadius:'10px',opacity:.6},
      {left:to.x+'px',top:to.y+'px',width:to.w+'px',height:to.h+'px',borderRadius:'14px',opacity:1}

function openViewer(src, fromEl, opt){
  if(opt&&opt.video){ shotSet=null; openVideoViewer(src, fromEl, opt); return; }
  if(!(opt&&opt.shots)) shotSet=null;
  const v=$('#viewer');
  v.classList.remove('video');

  const swap=!!(opt&&opt.swap) && v.classList.contains('on') && !v.classList.contains('closing');
  const token=++viewToken;
  const card=$('.viewer-card', v), img=$('img', card), cap=$('.viewer-cap', v);
  const g=GALLERY.find(x=>x.src===src);
  cap.textContent='';
  img.alt=g?g.cap:'';

  const known=fromEl?$('img', fromEl):null;
  const start=()=>{
    if(token!==viewToken) return;
    const nw=(known&&known.naturalWidth)||img.naturalWidth||16;
    const nh=(known&&known.naturalHeight)||img.naturalHeight||9;
    const to=photoBox(nw, nh);
    let from, posFrom, radiusFrom;
    if(swap){
      from=to;

    } else if(fromEl){

    } else {

    if(swap) card.animate([{opacity:0,transform:'scale(.985)'},{opacity:1,transform:'scale(1)'}],{duration:280,easing:'cubic-bezier(.2,.7,.2,1)'});
    const ms=swap?10:560;
    setTimeout(()=>{ if(token===viewToken) v.classList.add('settled'); }, Math.round(ms*0.55));
    morphCard(from, to, { posFrom, posTo:'center center', radiusFrom, radiusTo:'14px', ms, caption:false })

}
function closeViewer(){

let padPrev={}, padRepeat={}, padOn=false;
function pollPad(ts){
  const pads=navigator.getGamepads?navigator.getGamepads():[]; const p=[...pads].find(Boolean);
  if(p){
    if(!padOn){ padOn=true; $('#ctrl').classList.add('pad'); toast('Controller connected'); }
    const ax=p.axes[0]||0, ay=p.axes[1]||0, B=i=>p.buttons[i]&&p.buttons[i].pressed;
    const dirs={ L:B(14)||ax<-.5, R:B(15)||ax>.5, U:B(12)||ay<-.5, D:B(13)||ay>.5 };
    const vec={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]};
    const btn={ok:B(0)||B(2), back:B(1)||B(9)||B(8), L:B(4)||B(6), R:B(5)||B(7)};
    if(S.screen==='sleep'){
      const pressed=dirs.L||dirs.R||dirs.U||dirs.D||btn.ok||btn.back||btn.L||btn.R;
      if(pressed && !padPrev.wake) wake();
      padPrev.wake=pressed;
    } else {
      for(const d in dirs){
        if(dirs[d]){ if(!padPrev[d]){ padRepeat[d]=ts+380; move(...vec[d]); } else if(ts>padRepeat[d]){ padRepeat[d]=ts+110; move(...vec[d]); } }
        padPrev[d]=dirs[d];
      }
      if(btn.L && !padPrev.L) tabStep(-1);
      if(btn.R && !padPrev.R) tabStep(1);
      if(btn.ok && !padPrev.ok){ SFX.init(); ok(); }
      if(btn.back && !padPrev.back) back();
    }
    padPrev.L=btn.L; padPrev.R=btn.R;
    padPrev.ok=btn.ok; padPrev.back=btn.back;
  }
  requestAnimationFrame(pollPad);
}

/* =====================================================================
   LIVE STATUS — "Online · Playing X for 2 hours" card on the user page
   Reads status.json, written every 30s by the Mac agent in /status-agent.
   Preview the design without the agent: add ?status=demo to the URL.
   ===================================================================== */
const LIVE = {
  cloud: 'https://brady-status.bradywilliams2029.workers.dev',  // Cloudflare Worker the Mac script posts to
  url: 'status.json',        // change to a hosted URL once the site is deployed
  poll: 20000,               // how often the page re-checks (ms)
  staleAfter: 150            // seconds without an update before showing Offline
};
const LIVE_TILE = (bg, fg, glyph) => 'data:image/svg+xml,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98 107"><rect width="98" height="107" fill="${bg}"/>${glyph.replace(/FG/g, fg)}</svg>`);
const LIVE_IDLE = LIVE_TILE('#e9e9e9','#9a9a9a','<path d="M49 30 24 51h7v24h13V61h10v14h13V51h7z" fill="FG"/>');
const SPOTIFY_ICON = 'assets/apps/spotify-app.png';
const liveLetter = t => LIVE_TILE('#1e1e1e','#fff',`<text x="49" y="66" font-family="system-ui,sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="FG">${esc(t[0])}</text>`);

function liveDur(sec){
  const m = Math.floor(sec/60), h = Math.floor(m/60), mm = m%60;
  if(m < 1) return 'Just started playing';
  const hs = h ? `${h} hour${h>1?'s':''}` : '', ms = mm ? `${mm} minute${mm>1?'s':''}` : '';
  return 'Playing for ' + [hs, ms].filter(Boolean).join(' ');
}
function liveAgo(sec){
  const m = Math.floor(sec/60), h = Math.floor(m/60), d = Math.floor(h/24);
  if(m < 2)  return 'Last online just now';
  if(m < 60) return `Last online ${m} minutes ago`;
  if(h < 24) return `Last online ${h} hour${h>1?'s':''} ago`;
  return d === 1 ? 'Last online yesterday' : `Last online ${d} days ago`;
}
/* Same buckets the Switch profile uses. Under 5 hours stays "a little while". */
function playPhrase(sec){
  const h = sec / 3600;
  for(const n of [1000,500,300,200,150,100,70,50,35,20,10,5]){
    if(h >= n) return { t:`Played for ${n} hours or more`, dim:false };
  }
  return { t:'Played for a little while', dim:true };
}

const LV = { data:null, got:0 };      // last status + client time it arrived
function liveRender(){
  const box = $('#about .ps-now'); if(!box) return;
  const img = $('.ps-game', box), on = $('.ps-online', box), name = $('.ps-game-name', box), sub = $('.ps-sub', box);
  const d = LV.data, nowS = Date.now()/1000;
  const fresh = !!(d && d.updated && nowS - d.updated < LIVE.staleAfter);
  const since = t => Math.max(0, nowS - t);
  let cover = LIVE_IDLE, state = 'off', title = 'Offline', line = '', kind = '';

  const playing = fresh && d.app && APPS[d.app];
  const listening = fresh && d.spotify && d.spotify.track;
  if(playing){
    const a = APPS[d.app];
    if(a.app){ cover = a.icon; kind = 'app'; }
    else { cover = a.cover || liveLetter(a.t); kind = 'art'; }
    state = 'on'; title = a.t; line = liveDur(since(d.appSince));
  } else if(listening){
    cover = SPOTIFY_ICON; kind = 'app';
    state = 'on'; title = 'Playing Spotify';
    line = d.spotify.artist ? d.spotify.track + ' - ' + d.spotify.artist : d.spotify.track;
  } else {
    const key = d && (d.last || d.app);
    const a = key && key !== 'spotify' && APPS[key];
    if(a){
      if(a.app){ cover = a.icon; kind = 'app'; }
      else { cover = a.cover || liveLetter(a.t); kind = 'art'; }
      title = a.t;
    } else if(key === 'spotify'){
      cover = SPOTIFY_ICON; kind = 'app'; title = 'Spotify';
    } else title = 'Not playing right now';
    line = d && d.updated ? liveAgo(nowS - d.updated) : '';
  }
  if(img.getAttribute('src') !== cover) img.src = cover;
  img.classList.toggle('art', kind === 'art');
  img.classList.toggle('app', kind === 'app');
  img.alt = state === 'on' ? title : '';
  on.lastChild.textContent = state === 'on' ? 'Online' : 'Offline';
  on.classList.toggle('off', state !== 'on');
  name.textContent = title; name.title = title;
  setSubLine(sub, line);
  paintPlays(fresh && (d.app || (listening ? 'spotify' : null)));
}
function setSubLine(sub, line){
  if(sub.dataset.line === line) return;
  sub.dataset.line = line;
  sub.classList.remove('marquee');
  sub.style.removeProperty('--marq');
  sub.textContent = line;
  sub.title = line;
  if(!line || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  requestAnimationFrame(() => {
    if(sub.dataset.line !== line || !sub.clientWidth) return;
    if(sub.scrollWidth <= sub.clientWidth + 2) return;
    const dur = Math.max(12, Math.round(line.length * 0.18));
    sub.style.setProperty('--marq', dur + 's');
    sub.classList.add('marquee');
    sub.innerHTML = `<span class="ps-marq"><i>${esc(line)}</i><i>${esc(line)}</i></span>`;
  });
}
function paintPlays(active){
  $$('#about .play').forEach(el => {
    const span = $('.tx span', el);
    if(!span) return;
    let sec = LV.data && LV.data.totals && LV.data.totals[el.dataset.app];
    const on = el.dataset.app === active;
    if(typeof sec === 'number' && on && LV.got) sec += Math.max(0, Math.min(120, (Date.now()-LV.got)/1000));
    if(typeof sec === 'number'){
      const phrase = playPhrase(sec);
      span.textContent = phrase.t;

    } else {

}
async function livePoll(){
  try{
    let d=null;
    try{
      const rc = await fetch(LIVE.cloud + '?t=' + Date.now(), { cache:'no-store' });
      if(rc.ok){ const j = await rc.json(); if(j && j.updated) d=j; }
    }catch(e){}
    if(!d){
      const r = await fetch(LIVE.url + (LIVE.url.includes('?')?'&':'?') + 't=' + Date.now(), { cache:'no-store' });
      if(r.ok) d = await r.json();
    }
    if(d){ LV.data = d; LV.got = Date.now(); }
  }catch(e){ /* no status file yet: card shows Offline */ }
  liveRender();
}
function liveDemo(){
  const t = Math.floor(Date.now()/1000), frames = [
    { updated:t, app:'vscode', appSince:t-8040, totals:{ vscode:220*3600, blender:6*3600, figma:300*3600 } },
    { updated:t, app:'blender', appSince:t-2280, totals:{ vscode:220*3600, blender:6*3600, figma:300*3600 } },
    { updated:t, app:null, spotify:{ track:'Demo Song', artist:'Demo Artist', art:null }, totals:{ figma:300*3600 } },
    { updated:t-180, app:null, last:'cursor', totals:{} },
    { updated:t-10800, app:null, last:'xcode', totals:{ xcode:100*3600 } }
  ];
  let i = 0;
  const step = () => { const f = frames[i++ % frames.length]; const dt = Math.floor(Date.now()/1000) - t;
    LV.data = JSON.parse(JSON.stringify(f)); LV.data.updated += dt; if(LV.data.appSince) LV.data.appSince += dt;
    LV.got = Date.now(); liveRender(); };
  step(); setInterval(step, 4000);
}
if(new URLSearchParams(location.search).get('status') === 'demo') liveDemo();
else { livePoll(); setInterval(livePoll, LIVE.poll); setInterval(liveRender, 30000);
       document.addEventListener('visibilitychange', () => { if(!document.hidden) livePoll(); }); }
</script>
